<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AI恋爱顾问</title>


<style>

body{

background:#fff0f6;

font-family:"Microsoft YaHei";

}


.box{

max-width:430px;

margin:auto;

padding:20px;

}


.chat{

background:white;

padding:15px;

border-radius:20px;

min-height:400px;

}


input{

width:70%;

padding:12px;

border-radius:20px;

border:1px solid pink;

}


button{

padding:12px;

border:none;

background:#ff6fa5;

color:white;

border-radius:20px;

}


.msg{

background:#ffd6e8;

padding:12px;

border-radius:15px;

margin:10px;

}


</style>

</head>



<body>


<div class="box">


<h2>
🤖 AI恋爱顾问
</h2>


<div class="chat" id="chat">

<div class="msg">

你好～告诉我你的恋爱问题 💕

</div>


</div>


<input id="text" placeholder="输入问题">

<button onclick="send()">
发送
</button>


</div>




<script>


function send(){


let t=document.getElementById("text").value;


let chat=document.getElementById("chat");


chat.innerHTML+=`

<div class="msg">
你：${t}
</div>
`;


let answer="";


if(t.includes("喜欢")){

answer="判断喜欢可以观察他的主动程度、关心和行动 💕";

}

else if(t.includes("脱单")){

answer="多认识新朋友，提高自信，你的魅力会增加 🌸";

}

else{

answer="告诉我更多情况，我帮你分析爱情问题 💖";

}



chat.innerHTML+=`

<div class="msg">
AI：${answer}
</div>
`;

}


</script>


</body>

</html>
