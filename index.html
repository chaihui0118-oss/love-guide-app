body{

background:linear-gradient(#ffd6e8,#fff);

display:flex;

justify-content:center;

/* 手机APP */

.app{

width:100%;

max-width:430px;

padding:25px 18px 50px;

/* 动画 */

.fall{

position:fixed;

top:-50px;

animation:fall linear infinite;

z-index:1;

}


@keyframes fall{

100%{

transform:translateY(110vh) rotate(360deg);

}

}



.header{

text-align:center;

position:relative;

}


.avatar{

width:100px;

border-radius:50%;

.card{

align-items:center;

padding:18px;

margin-top:15px;

border-radius:22px;

text-decoration:none;

color:#333;

box-shadow:0 8px 20px rgba(255,100,150,.15);

position:relative;

z-index:2;

}



.icon{

font-size:30px;

margin-right:15px;

}



.small{

font-size:13px;

color:#999;

margin-top:5px;

}



.box{

background:white;

padding:20px;

border-radius:25px;

margin-top:20px;

text-align:center;

position:relative;

z-index:2;

}



.tarot-card{

height:200px;

width:140px;

background:#ff6fa5;

border-radius:20px;

margin:20px auto;

display:flex;

justify-content:center;

align-items:center;

font-size:50px;

color:white;

cursor:pointer;

}

</head>
